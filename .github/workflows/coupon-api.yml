name: CouponAPI CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - feature/megha-couponapi

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CouponAPI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/mdkasims-ccg/mango.services.couponapi:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/mdkasims-ccg/mango.services.couponapi:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max