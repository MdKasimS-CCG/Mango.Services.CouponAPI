name: CouponAPI CI/CD

on:
  push:
    branches:
      - feature/megha-couponapi

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CouponAPI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: |
            ghcr.io/mdkasims-ccg/mango.services.couponapi:latest
            ghcr.io/mdkasims-ccg/mango.services.couponapi:${{ github.sha }}